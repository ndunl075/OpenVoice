[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dictation-daemon"
path = "src/main.rs"

[features]
default = []
# Pass-throughs so a GPU backend can be selected from the binary being
# built (`cargo build -p daemon --features vulkan`) rather than only by
# editing `asr`'s manifest. See crates/asr/Cargo.toml for what each one
# needs at build time.
vulkan = ["asr/vulkan"]
cuda = ["asr/cuda"]
metal = ["asr/metal"]

[dependencies]
asr = { version = "0.1.0", path = "../asr" }
audio-input = { version = "0.1.0", path = "../audio-input" }
cleanup = { version = "0.1.0", path = "../cleanup" }
hotkey = { version = "0.1.0", path = "../hotkey" }
inject = { version = "0.1.0", path = "../inject" }
ring-buffer = { version = "0.1.0", path = "../ring-buffer" }
thiserror = "2.0.20"
vad = { version = "0.1.0", path = "../vad" }
