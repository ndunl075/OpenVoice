[package]
name = "tray-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dictation-tray"
path = "src/main.rs"

[features]
default = []
# Pass-throughs to `asr`'s GPU backends via `daemon` -- this is the
# binary most people actually run, so `cargo build -p tray-app --release
# --features vulkan` should work without editing any manifest. See
# crates/asr/Cargo.toml for build-time requirements.
vulkan = ["daemon/vulkan"]
cuda = ["daemon/cuda"]
metal = ["daemon/metal"]

[dependencies]
daemon = { version = "0.1.0", path = "../daemon" }
hotkey = { version = "0.1.0", path = "../hotkey" }
eframe = "0.36.1"
image = "0.25.10"
thiserror = "2.0.20"
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
